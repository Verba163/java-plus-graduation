application.name=event-service
application.date-time-format=yyyy-MM-dd HH:mm:ss
spring.main.banner-mode=OFF
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.format_sql=true
spring.jpa.jdbc.time_zone=UTC
spring.sql.init.mode=always
spring.datasource.driverClassName=org.postgresql.Driver

spring.datasource.url=jdbc:postgresql://event-db:5432/event_service
spring.datasource.username=event
spring.datasource.password=event

stat-service.stat-server-id=stats-server

management.endpoints.web.exposure.include=*
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.springframework.orm.jpa.JpaTransactionManager=WARN
logging.level.org.springframework.transaction=WARN
logging.level.org.springframework.transaction.interceptor=WARN
server.port=8084