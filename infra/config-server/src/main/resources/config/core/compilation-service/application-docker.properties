# Application Settings
application.name=compilation-service
application.date-time-format=yyyy-MM-dd HH:mm:ss

# Spring Boot Settings
spring.main.banner-mode=OFF

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.format_sql=true
spring.jpa.jdbc.time_zone=UTC

# DataSource Settings
spring.sql.init.mode=always
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://compilation-db:5432/compilation_service
spring.datasource.username=compilation
spring.datasource.password=compilation

# Management Endpoints Exposure
management.endpoints.web.exposure.include=*

# Logging Levels
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.springframework.orm.jpa.JpaTransactionManager=WARN
logging.level.org.springframework.transaction=WARN
logging.level.org.springframework.transaction.interceptor=WARN

# Server Port (auto-selected)
server.port=8183