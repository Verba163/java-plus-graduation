# Application information
application.name=category-service

# Date and time format
application.date-time-format=yyyy-MM-dd HH:mm:ss

# Spring Boot startup configuration
spring.main.banner-mode=OFF

# Hibernate and JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.format_sql=true
spring.jpa.jdbc.time_zone=UTC

# SQL initialization mode
spring.sql.init.mode=always

# DataSource (database connection) configuration
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:6543/category_service
spring.datasource.username=category
spring.datasource.password=category

# Security and endpoint exposure
management.endpoints.web.exposure.include=*

# Logging levels for Spring ORM and transaction management
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.springframework.orm.jpa.JpaTransactionManager=WARN
logging.level.org.springframework.transaction=WARN
logging.level.org.springframework.transaction.interceptor=WARN

# Server port configuration
server.port=0
