# Application Settings
application.name=comments-service
application.date-time-format=yyyy-MM-dd HH:mm:ss

# Spring Boot Settings
spring.main.banner-mode=OFF

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.format_sql=true
spring.jpa.jdbc.time_zone=UTC

# DataSource Settings
spring.sql.init.mode=always
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:6544/comments_service
spring.datasource.username=comments
spring.datasource.password=comments

# Management Endpoints Exposure
management.endpoints.web.exposure.include=*

# Logging Levels
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.springframework.orm.jpa.JpaTransactionManager=WARN
logging.level.org.springframework.transaction=WARN
logging.level.org.springframework.transaction.interceptor=WARN

# Server Ports (auto-selects free port)
server.port=0
